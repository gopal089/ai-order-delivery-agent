spring.application.name=backend
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

auth.access-token-signing-key=${AUTH_ACCESS_TOKEN_SIGNING_KEY}
auth.access-token-ttl=PT15M
auth.refresh-token-ttl=P30D

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:3001,http://localhost:3001}

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false

auth.rate-limit.namespace=${AUTH_RATE_LIMIT_NAMESPACE:auth:ratelimit}
auth.rate-limit.login-identity-max-attempts=${AUTH_RATE_LIMIT_LOGIN_IDENTITY_MAX_ATTEMPTS:5}
auth.rate-limit.login-identity-window=${AUTH_RATE_LIMIT_LOGIN_IDENTITY_WINDOW:PT15M}
auth.rate-limit.login-ip-max-attempts=${AUTH_RATE_LIMIT_LOGIN_IP_MAX_ATTEMPTS:60}
auth.rate-limit.login-ip-window=${AUTH_RATE_LIMIT_LOGIN_IP_WINDOW:PT1M}
auth.rate-limit.refresh-session-max-attempts=${AUTH_RATE_LIMIT_REFRESH_SESSION_MAX_ATTEMPTS:30}
auth.rate-limit.refresh-session-window=${AUTH_RATE_LIMIT_REFRESH_SESSION_WINDOW:PT1M}
auth.rate-limit.refresh-ip-max-attempts=${AUTH_RATE_LIMIT_REFRESH_IP_MAX_ATTEMPTS:120}
auth.rate-limit.refresh-ip-window=${AUTH_RATE_LIMIT_REFRESH_IP_WINDOW:PT1M}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis

logging.structured.format.console=${LOG_STRUCTURED_FORMAT:logstash}
logging.structured.json.context.include=true
