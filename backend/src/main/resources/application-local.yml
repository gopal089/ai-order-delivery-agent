spring:
  config:
    activate:
      on-profile: local
  application:
    name: ${SPRING_APPLICATION_NAME:backend}
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
