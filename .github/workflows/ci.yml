name: Project verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  contracts-and-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: CI safety and evaluation reporter contracts
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/tests -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evaluation -p 'test_*.py' -v
          node infrastructure/validate-environments.mjs
          node --test infrastructure/tests/*.test.mjs
      - name: Scan complete Git history for secrets (redacted, no report artifact)
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-level error

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate masked disposable runner configuration
        run: bash .github/scripts/prepare-local-env.sh
      - name: Start existing local test infrastructure
        run: docker compose up -d --wait --wait-timeout 120
      - name: Run all backend tests with fresh evidence (no silently skipped database tests)
        run: python3 evaluation/report.py --run --scope full
      - name: Run independent deterministic baseline
        run: python3 evaluation/report.py --run --scope baseline
      - name: Package application
        working-directory: backend
        run: ./gradlew bootJar --console=plain
      - name: Retain sanitized evaluation JSON only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safe-evaluation-${{ github.sha }}
          path: |
            backend/build/reports/evaluation/full.json
            backend/build/reports/evaluation/baseline.json
          retention-days: 7
          if-no-files-found: warn
      - name: Stop disposable runner infrastructure
        if: always()
        run: docker compose down --volumes

  clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        directory: [web, extension]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci
      - name: Lint
        working-directory: ${{ matrix.directory }}
        run: npm run lint
      - name: Build and test both clients
        working-directory: ${{ matrix.directory }}
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
        run: |
          if [[ -f next.config.ts ]]; then npm run typecheck; fi
          npm run build
          node --test tests/*.test.mjs
          npm audit --omit=dev --audit-level=high

  docker:
    needs: [contracts-and-secrets, backend, clients]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate masked disposable runner configuration
        run: bash .github/scripts/prepare-local-env.sh
      - name: Build local verification images only (no registry push)
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build --pull --label "org.opencontainers.image.revision=$REVISION" -t "ai-order-backend:ci-$REVISION" backend
          docker build --pull --label "org.opencontainers.image.revision=$REVISION" \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8080 --build-arg ALLOW_LOCAL_API=true \
            -t "ai-order-web:ci-$REVISION" web
      - name: Probe packaged containers on disposable infrastructure
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker compose up -d --wait --wait-timeout 120
          python3 .github/scripts/container_smoke.py --backend "ai-order-backend:ci-$REVISION" --web "ai-order-web:ci-$REVISION"
      - name: Stop disposable runner infrastructure
        if: always()
        run: docker compose down --volumes
